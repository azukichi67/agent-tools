services:
  dev:
    build:
      context: ./docker
    container_name: ${PROJECT_NAME:-agent-dev}
    init: true
    ports:
      - "${SSH_PORT:-2222}:22"
    volumes:
      - .:/workspace:cached
      - dev-home:/home/dev
      - ${SSH_PUBLIC_KEY_PATH:-~/.ssh/id_ed25519.pub}:/home/dev/.ssh/authorized_keys:ro
    restart: unless-stopped

volumes:
  dev-home:
